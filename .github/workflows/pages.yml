name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1) Pages konfiguratsiyasini tekshirish va "GitHub Actions" manbasiga o'tkazish
      - name: Configure Pages
        id: cfg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          H=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          {
            echo "### 📄 Pages konfiguratsiyasi (avvalgi)"
            echo '```json'
            curl -s "${H[@]}" "https://api.github.com/repos/$REPO/pages" -o /tmp/pages.json
            head -c 900 /tmp/pages.json
            echo '```'
            echo ""
            echo "**`build_type=workflow` ga o'tkazish**"
            pcode=$(curl -s -o /tmp/put.json -w "%{http_code}" -X PUT "${H[@]}" -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "https://api.github.com/repos/$REPO/pages")
            echo "- PUT /pages → \`$pcode\`"
            echo '```json'
            head -c 600 /tmp/put.json
            echo '```'
            echo ""
            echo "**Yangi konfiguratsiya**"
            echo '```json'
            curl -s "${H[@]}" "https://api.github.com/repos/$REPO/pages" | head -c 900
            echo '```'
          } | tee /tmp/diag.txt
          cat /tmp/diag.txt >> "$GITHUB_STEP_SUMMARY"

      # 2) Holat faylini repo'ga yozish (keyin raqamli tekshirish uchun)
      - name: Publish status file
        continue-on-error: true
        run: |
          set +e
          mkdir -p .madina
          python3 - <<'PY' > .madina/pages-status.json
          import json, datetime, subprocess
          try:
              cfg = json.load(open('/tmp/pages.json'))
          except Exception:
              cfg = {}
          out = {
              "deployed_at": datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              "commit": subprocess.run(['git','rev-parse','--short','HEAD'],capture_output=True,text=True).stdout.strip(),
              "live": "https://xolerc.github.io/xoleric-home/",
              "pages": {"build_type": cfg.get("build_type"), "source": cfg.get("source"), "html_url": cfg.get("html_url")},
          }
          print(json.dumps(out, indent=2, ensure_ascii=False))
          PY
          cat .madina/pages-status.json
          git config user.name "xoleric-bot"
          git config user.email "xolerc@users.noreply.github.com"
          git add .madina/pages-status.json
          git commit -m "chore: pages holat fayli [skip ci]" || true
          git push origin HEAD:main || true

      # 3) Arxiv (Actions artifact) — zaxira sifatida
      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp index.html three.min.js _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Natija
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo ""
            echo "### 🚀 Natija"
            echo "- deploy-pages: \`$DEPLOY_OUTCOME\`"
            echo "- page_url: ${DEPLOY_URL:-branch orqali (main) — avtomatik}"
            echo "- live: https://xolerc.github.io/xoleric-home/"
          } >> "$GITHUB_STEP_SUMMARY"
