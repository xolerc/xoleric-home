var keys={};

  if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault()});
addEventListener('keyup',function(e){keys[e.code]=0});

function canWalk(x,z){
  if(x>=-8.6&&x<=8.6&&z>=-5.7&&z<=5.7)return true;      /* xona */
  if(x>=-1.05&&x<=1.05&&z>=5.7&&z<=7.5)return true;       /* eshik + peshtaxta */
  return false;
}
var joyV={x:0,y:0};
function walk(dt){
  if(mode!=='in'||ko)return;
  var f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  var s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  if(COARSE){f+=-joyV.y;s+=joyV.x}
  var m=Math.hypot(f,s);if(m>1){f/=m;s/=m}
  if(!f&&!s)return;
  var sp=dt*2.6;
  var dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*sp;
  var dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;
  var nx=player.x+dx,nz=player.z+dz;
  if(canWalk(nx,nz)){player.x=nx;player.z=nz}
  else{
    if(canWalk(nx,player.z))player.x=nx;
    if(canWalk(player.x,nz))player.z=nz;
  }
  var te=inRoom(player.x,player.z)?1.72:1.60;
  player.eye+=(te-player.eye)*Math.min(1,dt*7);
}

/* ---------- AI ---------- */
function step(c,dt){
  var p=c.g.position;
  if(c.down>0){                                   /* yiqilgan: ko'pishgacha yotadi */
    c.down-=dt;
    c.g.rotation.x=-1.42;c.g.position.y=.42;c.hips.rotation.x=.22;
    if(c.down<=0){
      c.down=0;c.hp=100;c.g.rotation.x=0;c.g.position.y=0;c.hips.rotation.x=0;
      c.stun=0;c.state='walk';c.path=[];c.wait=1.6;
      c.g.position.set(c.home[0],0,c.home[1]);
    }
    return;
  }
  if(c.stun>0){
    c.stun-=dt;
    var damp=Math.pow(.94,dt*60);               /* FPS-dan mustaqil so'nish */
    p.x=cl(p.x+c.kx*dt,-19.3,19.3);p.z=cl(p.z+c.kz*dt,-9.2,15.2);
    c.kx*=damp;c.kz*=damp;
    c.hips.rotation.x=-.9;c.lA.rotation.x=c.rA.rotation.x=-2.5;c.hips.position.y=.8;
    if(c.stun<=0){c.hips.rotation.x=0;c.hips.position.y=.95;c.path=[];c.state='walk';c.wait=.5}
    return;
  }
  p.x=cl(p.x,-19.3,19.3);p.z=cl(p.z,-9.2,15.2);
  var P=playerPos();
  var hot=!!P&&!ko&&Math.hypot(P.x-p.x,P.z-p.z)<11&&inside(P.x,P.z)===inside(p.x,p.z);
  if(hot){
    if(c.state=='walk'||c.zt!==inside(P.x,P.z)){c.state='chase';c.zt=inside(P.x,P.z);plan(c,P.x,P.z)}
    if(c.path.length)c.path[c.path.length-1]=[P.x,P.z];else plan(c,P.x,P.z);
  }
  else if(c.state!='walk'){c.state='walk';c.path=[];c.wait=1.2}
  var chasing=c.state!='walk',moving=false,spd=1.3;
  if(!c.path.length&&(c.wait-=dt)<=0){
    var w=Math.random()<.62?OUT[Math.random()*OUT.length|0]:INN[Math.random()*INN.length|0];
    plan(c,w[0],w[1]);
  }
  if(c.path.length){
    var tx=c.path[0][0],tz=c.path[0][1],d=Math.hypot(tx-p.x,tz-p.z),last=c.path.length==1;
    if(chasing&&last&&d<(c.state=='fight'?1.7:1.35)&&inside(p.x,p.z)===inside(tx,tz)){
      c.state='fight';face(c,tx,tz,dt);c.pt+=dt;
      if(c.pt>.85){
        c.pt=0;c.arm^=1;
        if(!ko&&!c.down){
          hp=Math.max(0,hp-7);hitT=.25;regenT=2;
          burst({x:tx,y:.4,z:tz},[1,.25,.3],16,3.5);sfx('hit');
        }
      }
    }
    else{
      if(chasing&&last)c.state='chase';
      spd=chasing?2.6:1.3;face(c,tx,tz,dt);
      var mv=Math.min(spd*dt,d);
      p.x+=(tx-p.x)/(d||1)*mv;p.z+=(tz-p.z)/(d||1)*mv;moving=true;
      if(d<.25&&!(chasing&&last)){c.path.shift();if(!c.path.length)c.wait=1+Math.random()*3}
    }
  }
  p.y+=((inside(p.x,p.z)?.32:0)-p.y)*Math.min(1,dt*10);
  var L=c.lL,Rl=c.rL;
  if(moving){
    c.ph+=dt*spd*3.2;
    var s2=Math.sin(c.ph)*.7*Math.min(1,spd/1.3);
    L.rotation.x=s2;Rl.rotation.x=-s2;c.rA.rotation.x=s2*.8;c.lA.rotation.x=-s2*.8;
    c.hips.position.y=.95+Math.abs(Math.cos(c.ph))*.03;
  }
  else{[L,Rl,c.lA,c.rA].forEach(function(l){l.rotation.x*=.85});c.hips.position.y=.95}
  if(c.state=='fight'){var a=c.arm?c.rA:c.lA;a.rotation.x=c.pt<.3?-Math.sin(c.pt/.3*Math.PI)*1.9:0}
}

/* ---------- UI ---------- */
var HINT={
  out:'Ko‘cha rejimi: hovli devori orqasidan uy ichi ko‘rinmaydi. Bu rejimda faqat kuzatish mumkin.',
  yard:'Hovli rejimi: kursorni personajlarga yaqinlashtiring — ular sizga hujjat qiladi.',
  in:'Ichki rejimi: WASD (yoki tugma) bilan yuring, chap tugma bilan urish, o‘ng tugma/barmoq bilan aylantiring.',
  top:'Tepadan rejimi: chizish va jang ishlaydi, g‘ildirak bilan yaqinlashiring.',
  cam:'Kamera: chap tugma bilan aylantiring, g‘ildirak bilan masofa.',
  fight:'Jang: personaj ustiga bosing (zarba 2.3 m ichida). O‘ng tugma bilan aylantiring.',
  draw:'Chizish: bosing va sudrang — tanlangan shakl chiziladi. “Tozalash” — chizilganini o‘chiradi.'
};
function hint(){
  $('#hint').textContent=mode=='out'?HINT.out:(HINT[mode]+' '+HINT[tool]);
}
function setMode(m){
  mode=m;
  up.visible=m!='top';
  roofM.transparent=(m=='top');roofM.opacity=(m=='top')?.1:1;roofM.depthWrite=(m!='top');roofM.needsUpdate=true;
  if(m=='in'){yaw=0;pit=-.34;player.x=0;player.z=3.2;player.eye=1.72}
  applyCam(m);
  $$('[data-v]').forEach(function(b){b.classList.toggle('on',b.dataset.v==m)});
  $$('[data-t]').forEach(function(b){b.disabled=(m=='out'&&b.dataset.t!=='cam')});
  $('#joy').hidden=!(m=='in'&&COARSE);
  hint();upd();
}
$$('[data-v]').forEach(function(b){b.onclick=function(){setMode(b.dataset.v);sfx('tap')}});
$$('[data-t]').forEach(function(b){b.onclick=function(){
  tool=b.dataset.t;$$('[data-t]').forEach(function(x){x.classList.toggle('on',x===b)});
  $('#gs').hidden=tool!='draw';hint();sfx('tap');
}});
$$('[data-s]').forEach(function(b){b.onclick=function(){
  shape=b.dataset.s;$$('[data-s]').forEach(function(x){x.classList.toggle('on',x===b)});sfx('tap');
}});
$('#clr').onclick=function(){clearArt();sfx('tap')};
$('#fb').onclick=function(e){
  fansOn=!fansOn;e.currentTarget.classList.toggle('on',fansOn);
  e.currentTarget.textContent=fansOn?'Parrak: yoqilgan':'Parrak: o‘chirilgan';sfx('tap');
};

/* ---------- boshqaruv (sichqoncha + teginish) ---------- */
var ptr=new Map(),pd=0,pcx=0,pcy=0,drag=false,drawing=false,lx=0,ly=0,last=new T.Vector3();
function zoom(d){
  if(mode=='in'){fov=cl(fov+d*.02,40,88);setFov()}
  else{rad=cl(rad+d*.03,mode=='out'?30:5,mode=='out'?80:60)}
  upd();
}
function mv(e){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ptrIn=true;pick()}

cv.onpointerdown=function(e){
  try{cv.setPointerCapture(e.pointerId)}catch(err){}
  ptr.set(e.pointerId,e);mv(e);lx=e.clientX;ly=e.clientY;unlockAudio();
  if(ptr.size===2){
    var a=[...ptr.values()];
    pd=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);
    pcx=(a[0].clientX+a[1].clientX)/2;pcy=(a[0].clientY+a[1].clientY)/2;
    drag=drawing=false;return;
  }
  if(e.button===2||tool=='cam'||mode=='out'){drag=true;return}
  if(tool=='fight'){if(curOK&&!ko)shock(cur)}
  else if(tool=='draw'&&curOK&&mode!=='out'){drawing=true;last.copy(cur);place(cur)}
};
function endPtr(e){
  ptr.delete(e.pointerId);drag=drawing=false;
  if(e.pointerType&&e.pointerType!=='mouse'){ptrIn=false;curOK=false}   /* barmoq ko'tarilganda kursor "qotib" qolmasin */
  if(ptr.size===1){var r=[...ptr.values()][0];lx=r.clientX;ly=r.clientY;pd=0}
}
cv.onpointerup=cv.onpointercancel=cv.onlostpointercapture=endPtr;
cv.onpointerleave=function(e){if(e.pointerType==='mouse'&&!ptr.size)ptrIn=false};
cv.onpointermove=function(e){
  mv(e);
  if(ptr.has(e.pointerId))ptr.set(e.pointerId,e);
  if(ptr.size===2){
    var a=[...ptr.values()],d=Math.hypot(a[0].clientX-a[1].clientX,a[0].clientY-a[1].clientY);
    var cx2=(a[0].clientX+a[1].clientX)/2,cy2=(a[0].clientY+a[1].clientY)/2;
    if(pd>0&&Math.abs(d-pd)<2.5){                 /* ikki barmoq = aylantirish */
      yaw-=(cx2-pcx)*.004;
      if(mode!=='out')pit=cl(pit+(cy2-pcy)*.004,mode=='in'?-1.25:.02,mode=='in'?1.05:1.4);
      upd();
    }else zoom((pd-d)*3);
    pd=d;pcx=cx2;pcy=cy2;return;
  }
  var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  if(drag){
    if(mode=='in'){yaw-=dx*.004;pit=cl(pit-dy*.004,-1.25,1.05)}
    else if(mode=='out'){yaw-=dx*.004;hOut=cl(hOut+dy*.02,1.6,3.4)}
    else{yaw-=dx*.005;pit=cl(pit+dy*.005,.02,1.4)}
    upd();
  }
  else if(drawing&&curOK&&cur.distanceTo(last)>1.1){place(cur);last.copy(cur)}
};
cv.addEventListener('wheel',function(e){e.preventDefault();zoom(mode=='in'?e.deltaY:e.deltaY)},{passive:false});
cv.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- mobil joystick ---------- */
var joy=$('#joy'),knob=$('#knob'),joyId=null;
function joyMove(e){
  var r=joy.getBoundingClientRect();
  var dx=(e.clientX-(r.left+r.width/2))/(r.width/2),dy=(e.clientY-(r.top+r.height/2))/(r.height/2);
  var m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  joyV.x=dx;joyV.y=dy;
  knob.style.transform='translate('+(dx*(r.width/2-24))+'px,'+(dy*(r.height/2-24))+'px)';
}
joy.addEventListener('pointerdown',function(e){joyId=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(err){}
  joyMove(e);e.preventDefault()});
joy.addEventListener('pointermove',function(e){if(e.pointerId===joyId)joyMove(e)});
joy.addEventListener('pointerup',function(e){if(e.pointerId===joyId){joyId=null;joyV={x:0,y:0};knob.style.transform=''}});
joy.addEventListener('pointercancel',function(e){if(e.pointerId===joyId){joyId=null;joyV={x:0,y:0};knob.style.transform=''}});

/* ---------- oyna / sifat ---------- */
addEventListener('resize',function(){
  cam.aspect=innerWidth/innerHeight;setFov();
  R.setPixelRatio(Math.min(devicePixelRatio||1,LOW?1.5:2));
  R.setSize(innerWidth,innerHeight);
  var c=CAMS[mode];
  if(mode!=='in'&&c&&c.rad!==undefined)rad=c.rad*aspectK();
  upd();
});
var fpsAcc=0,fpsN=0,fpsVal=60,degraded=false;
function checkQuality(dt){
  fpsAcc+=dt;fpsN++;
  if(fpsN>=60){
    fpsVal=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0;
    $('#fps').textContent=fpsVal+' fps';
    if(!degraded&&fpsVal<26){
      degraded=true;R.setPixelRatio(1);
      if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}
      sun.shadow.mapSize.set(1024,1024);
    }
  }
}

/* ---------- boshlang'ich holat ---------- */
try{best=parseInt(localStorage.getItem(SC_KEY)||'0',10)||0}catch(e){}
try{localStorage.setItem(SC_KEY,String(best))}catch(e){}
loadArt();
setMode('yard');
$('#ld').hidden=true;

/* ---------- sikl ---------- */
var clk=new T.Clock();
(function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
  pick();
  walk(dt);
  chars.forEach(function(c){step(c,dt)});
  if(fansOn)fans.forEach(function(F){F.r.rotation.z-=dt*F.sp});
  sway.forEach(function(s){s[0].rotation.z=Math.sin(t*.9+s[1])*.018;s[0].rotation.x=Math.cos(t*.7+s[1])*.012});
  clouds.forEach(function(c){c.position.x+=dt*1.5;if(c.position.x>260)c.position.x=-260});
  leds.forEach(function(m,i){m.emissiveIntensity=(Math.sin(t*3+i)>.2)?1.2:.1});
  starT+=dt;if(starT>20&&stars>0){stars--;starT=0}
  hitT=Math.max(0,hitT-dt);regenT=Math.max(0,regenT-dt);
  if(!ko){
    if(hitT<=0&&regenT<=0)hp=Math.min(100,hp+dt*6);
    if(hp<=0){
      ko=4;hp=0;$('#ko').hidden=false;$('#koc').textContent='4 s';
      if(curOK)burst(cur,[1,.2,.2],60,6);
      sfx('ko');
    }
  }else{
    ko-=dt;$('#koc').textContent=Math.max(0,Math.ceil(ko))+' s';
    if(ko<=0){
      ko=0;hp=100;$('#ko').hidden=true;stars=0;starT=0;
      chars.forEach(function(c){c.down=0;c.stun=0;c.hp=100;c.g.rotation.x=0;c.g.position.y=0;c.hips.rotation.x=0;
        c.state='walk';c.path=[];c.wait=1.2;c.g.position.set(c.home[0],0,c.home[1])});
    }
  }
  $('#hp').style.width=hp+'%';
  $('#hp').style.background=hp<30?'#ff3344':'#4de1ff';
  $('#hpn').textContent=Math.max(0,Math.round(hp));
  $('#st').textContent='★'.repeat(stars)+'☆'.repeat(5-stars);
  $('#sc').textContent=score+(best>score?' / '+best:'');
  rt.visible=curOK;
  if(curOK){
    rt.position.set(cur.x,cur.y+.07,cur.z);
    var s3=1+.12*Math.sin(t*6)+(hitT>0?.3:0);rt.scale.set(s3,s3,s3);
    rm.color.setHex(ko?0x777777:(hitT>0?0xff3344:0x4de1ff));rl.color.copy(rm.color);
  }
  for(var i=0;i<rings.length;i++){
    var r=rings[i];r.scale.addScalar(dt*13);r.material.opacity=Math.max(0,1-r.scale.x/6);
    if(r.scale.x>6){scene.remove(r);r.material.dispose();rings.splice(i,1)}
  }
  objs.forEach(function(o){
    if(o.userData.g<1){
      o.userData.g=Math.min(1,o.userData.g+dt*3);
      var k=o.userData.g,s4=1+2.7*Math.pow(k-1,3)+1.7*Math.pow(k-1,2);
      o.scale.setScalar(Math.max(.01,s4));
    }
  });
  for(var j=0;j<NP;j++){
    var k2=j*3;
    if(pL[j]>0){
      pL[j]-=dt*1.3;pP[k2]+=pV[k2]*dt;pP[k2+1]+=pV[k2+1]*dt;pP[k2+2]+=pV[k2+2]*dt;pV[k2+1]-=7*dt;
      var f=Math.max(pL[j],0);pC[k2]=pB[k2]*f;pC[k2+1]=pB[k2+1]*f;pC[k2+2]=pB[k2+2]*f;
    }else pC[k2]=pC[k2+1]=pC[k2+2]=0;
  }
  pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true;
  checkQuality(dt);
  R.render(scene,cam);
})();
}
})();
